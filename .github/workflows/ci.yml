name: Validate

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          INTERNAL_API_SECRET: ci-only-secret
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          INTERNAL_API_SECRET: ci-only-secret

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devcard
          POSTGRES_PASSWORD: devcard_ci_only
          POSTGRES_DB: devcard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devcard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly to an empty database
        run: |
          export FERNET_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://devcard:devcard_ci_only@localhost:5432/devcard
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          GITHUB_OAUTH_CALLBACK_URL: http://localhost/cb
          SECRET_KEY: ci-secret-key
          INTERNAL_API_SECRET: ci-internal-secret
      - run: python -m unittest discover -s tests -t .
      - run: python -m compileall -q app tests